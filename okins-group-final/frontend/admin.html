<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Okins Group</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/css/site.css"></head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b bg-white"><div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4"><a href="./index.html" class="flex items-center gap-3"><img src="./assets/img/okins-mark.svg" class="h-10 w-10"><b class="tracking-widest">OKINS <span class="text-green-700">GROUP</span> <small class="font-normal tracking-normal text-slate-400">/ ADMIN</small></b></a><a href="./index.html" class="text-sm font-semibold text-green-700">← Lihat Website</a></div></header>
<main class="mx-auto max-w-7xl px-5 py-10">
<section id="login-panel" class="mx-auto max-w-md rounded-2xl bg-white p-8 shadow-lg"><p class="text-xs font-bold tracking-[.2em] text-green-700">ADMINISTRATOR</p><h1 class="mt-2 text-3xl font-extrabold">Masuk Dashboard</h1><p class="mt-2 text-sm text-slate-500">Gunakan akun admin yang dibuat pada backend Laravel.</p><form id="login-form" class="mt-7 space-y-4"><div><label class="mb-2 block text-sm font-bold">Email</label><input name="email" type="email" required class="form-field" placeholder="admin@okinsgroup.com"></div><div><label class="mb-2 block text-sm font-bold">Password</label><input name="password" type="password" required class="form-field" placeholder="Password"></div><button class="w-full rounded-lg bg-green-700 py-3 font-bold text-white">Login</button><p id="login-status" class="text-sm text-red-600"></p></form></section>
<section id="dashboard" class="hidden">
 <div class="mb-8 flex flex-wrap items-center justify-between gap-4"><div><p class="text-xs font-bold tracking-[.2em] text-green-700">CONTROL CENTER</p><h1 class="mt-2 text-3xl font-extrabold">Dashboard Okins Group</h1><p class="mt-1 text-sm text-slate-500">Kelola informasi publik perusahaan.</p></div><button id="logout" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold">Keluar</button></div>
 <div class="mb-6 flex flex-wrap gap-2"><button class="tab active" data-tab="profile">Profil</button><button class="tab" data-tab="missions">Misi</button><button class="tab" data-tab="divisions">Divisi</button><button class="tab" data-tab="messages">Pesan Masuk</button></div>
 <section id="tab-profile" class="admin-panel rounded-2xl bg-white p-6 shadow-sm"><h2 class="mb-5 text-xl font-extrabold">Informasi Perusahaan</h2><form id="profile-form" class="grid gap-4 md:grid-cols-2"><label class="field-label">Nama perusahaan<input name="name" required class="form-field"></label><label class="field-label">Email<input name="email" type="email" class="form-field"></label><label class="field-label md:col-span-2">Deskripsi<textarea name="description" rows="3" class="form-field"></textarea></label><label class="field-label md:col-span-2">Visi<textarea name="vision" rows="3" class="form-field"></textarea></label><label class="field-label">Alamat<input name="address" class="form-field"></label><label class="field-label">Telepon<input name="phone" class="form-field"></label><div class="md:col-span-2"><button class="rounded-lg bg-green-700 px-6 py-3 text-sm font-bold text-white">Simpan Profil</button></div></form><p id="profile-status" class="mt-3 text-sm"></p></section>
 <section id="tab-missions" class="admin-panel hidden rounded-2xl bg-white p-6 shadow-sm"><h2 class="mb-5 text-xl font-extrabold">Kelola Misi</h2><form id="mission-form" class="mb-6 flex flex-col gap-3 sm:flex-row"><input name="content" required maxlength="1000" class="form-field flex-1" placeholder="Tuliskan misi baru..."><button class="rounded-lg bg-green-700 px-6 py-3 text-sm font-bold text-white">Tambah Misi</button></form><div id="mission-admin-list" class="space-y-3"></div><p id="mission-status" class="mt-3 text-sm"></p></section>
 <section id="tab-divisions" class="admin-panel hidden rounded-2xl bg-white p-6 shadow-sm"><h2 class="mb-5 text-xl font-extrabold">Kelola Lini Divisi</h2><form id="division-form" class="mb-6 grid gap-3 md:grid-cols-[1fr_2fr_auto]"><input name="name" required class="form-field" placeholder="Nama divisi"><input name="description" required class="form-field" placeholder="Deskripsi divisi"><button class="rounded-lg bg-green-700 px-5 py-3 text-sm font-bold text-white">Tambah</button></form><div id="division-admin-list" class="space-y-3"></div><p id="division-status" class="mt-3 text-sm"></p></section>
 <section id="tab-messages" class="admin-panel hidden rounded-2xl bg-white p-6 shadow-sm"><h2 class="mb-5 text-xl font-extrabold">Pesan Kontak</h2><div class="overflow-x-auto"><table class="w-full min-w-[650px] text-left text-sm"><thead><tr class="border-b text-slate-500"><th class="p-3">Pengirim</th><th class="p-3">Email</th><th class="p-3">Pesan</th><th class="p-3">Tanggal</th></tr></thead><tbody id="messages-list"></tbody></table></div><p id="messages-status" class="mt-3 text-sm"></p></section>
</section>
</main><script src="./assets/js/config.js"></script><script src="./assets/js/admin.js"></script></body></html>
